databases:
  - name: breathe-esg-db
    plan: free
    databaseName: breathe_esg
    user: breathe_user

services:
  - type: web
    name: breathe-esg
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: breathe-esg-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DEMO_MODE
        value: "True"
      - key: PYTHON_VERSION
        value: "3.10.11"
      - key: NODE_VERSION
        value: "20"
